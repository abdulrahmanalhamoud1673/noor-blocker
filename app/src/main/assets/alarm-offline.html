<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منبّه نور</title>
<!--
  صفحة الطوارئ.

  إن لم تُحمَّل صفحة نور (لا إنترنت في الرابعة فجراً) بقي المنبّه
  يصرخ أمام شاشة بيضاء بلا مخرج. هذه الصفحة مخزّنة داخل التطبيق
  نفسه فتعمل دائماً.

  ولا رموز فيها: الطلب هو التصوير كما وعدناه. لا نملك نموذجاً
  يحكم بلا إنترنت، لكن الهاتف يرى بنفسه أن المشهد تغيّر — فنطلب
  ثلاثة أماكن مختلفة فعلاً. ولا يتغيّر المشهد وأنت في فراشك.
-->
<style>
  :root{ --bg:#04150F; --card:#0B241A; --line:rgba(212,175,55,.22);
         --gold:#D4AF37; --text:#EAF5F0; --muted:#6E8F82; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
  header{padding:10px 14px 12px;text-align:center;border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0 0 2px;font-weight:700;color:var(--gold)}
  .task{font-size:25px;font-weight:800;margin:0}
  .dots{display:flex;gap:9px;justify-content:center;margin-top:7px}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.16)}
  .dot.on{background:#10B981}
  .cam{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .hint{position:absolute;left:0;right:0;bottom:0;padding:14px 12px 10px;text-align:center;
        font-size:14px;font-weight:700;color:var(--gold);
        background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
  button{margin:10px 12px;padding:15px;border:none;border-radius:14px;background:var(--gold);
         color:#16130A;font-size:17px;font-weight:800;font-family:inherit}
  .ok{color:#10B981}
</style>
</head>
<body>

<header>
  <h1>حان وقت الفجر — لا إنترنت الآن</h1>
  <p class="task" id="task">صوّر مكاناً في البيت</p>
  <div class="dots" id="dots"></div>
</header>

<div class="cam">
  <video id="v" playsinline autoplay muted></video>
  <div class="hint" id="hint">جارٍ فتح الكاميرا…</div>
</div>

<button id="shoot">📸 صوّر هنا</button>

<script>
  var NEED = 3, done = 0;
  var MOVED = 26;          // فرق يكفي للقول: هذا مكان آخر
  var home = null, oks = [], ctx = null, ready = false;

  function paint() {
    document.getElementById("task").textContent =
      done >= NEED ? "قمتَ — تقبّل الله 🌅" : "صوّر مكاناً مختلفاً (" + (done + 1) + ")";
    var d = document.getElementById("dots");
    d.innerHTML = "";
    for (var i = 0; i < NEED; i++) {
      var e = document.createElement("div");
      e.className = "dot" + (i < done ? " on" : "");
      d.appendChild(e);
    }
  }
  function say(t) { document.getElementById("hint").textContent = t; }

  /** مصغّرة ملوّنة ٣٢×٢٤ — غرفتان بنفس الإضاءة تختلفان في اللون */
  function thumb() {
    var v = document.getElementById("v");
    if (!v.videoWidth) return null;
    if (!ctx) {
      var c = document.createElement("canvas");
      c.width = 32; c.height = 24;
      ctx = c.getContext("2d", { willReadFrequently: true });
    }
    ctx.drawImage(v, 0, 0, 32, 24);
    var d = ctx.getImageData(0, 0, 32, 24).data;
    var g = new Uint8Array(32 * 24 * 3);
    for (var i = 0, j = 0; i < d.length; i += 4, j += 3) {
      g[j] = d[i]; g[j + 1] = d[i + 1]; g[j + 2] = d[i + 2];
    }
    return g;
  }
  function diff(a, b) {
    if (!a || !b) return 255;
    var s = 0;
    for (var i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
    return s / a.length;
  }

  function judge() {
    if (!ready) { say("انتظر الكاميرا…"); return; }
    var cur = thumb();
    if (!cur) { say("لا صورة بعد…"); return; }
    if (!home) { home = cur; say("سُجّل مكانك — امشِ إلى غرفة أخرى"); return; }

    if (diff(home, cur) < MOVED) { say("هذا نفس المكان — امشِ إلى غرفة أخرى"); return; }
    for (var i = 0; i < oks.length; i++) {
      if (diff(oks[i], cur) < MOVED) { say("صوّرتَ هذا المكان — اذهب إلى غيره"); return; }
    }

    oks.push(cur);
    done++;
    try { navigator.vibrate && navigator.vibrate([40, 60, 40]); } catch (e) {}
    paint();
    if (done >= NEED) {
      say("سكت المنبّه — الصلاة خير من النوم");
      document.getElementById("hint").className = "hint ok";
      document.getElementById("shoot").style.display = "none";
      try { if (window.NoorApp && NoorApp.alarmSolved) NoorApp.alarmSolved(); } catch (e) {}
      return;
    }
    say("✓ مكان جديد — بقي " + (NEED - done));
  }

  async function start() {
    paint();
    try {
      var s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }, audio: false
      });
      var v = document.getElementById("v");
      v.srcObject = s;
      await v.play().catch(function () {});
      setTimeout(function () {
        ready = true;
        home = thumb();
        say("وجّه الكاميرا وامشِ إلى غرفة أخرى ثم صوّر");
      }, 900);
    } catch (e) {
      // الكاميرا معطّلة أيضاً: لا نحبس الهاتف
      say("تعذّر فتح الكاميرا");
      var b = document.getElementById("shoot");
      b.textContent = "أوقِف المنبّه";
      b.onclick = function () {
        try { if (window.NoorApp && NoorApp.alarmSolved) NoorApp.alarmSolved(); } catch (x) {}
      };
      return;
    }
    document.getElementById("shoot").addEventListener("click", judge);
  }
  start();
</script>
</body>
</html>
