name: بناء تطبيق نور

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── توقيع ثابت ──
      # كل بناءٍ كان يولّد مفتاح توقيع جديداً، وأندرويد يرفض تحديث
      # تطبيقٍ بمفتاحٍ مختلف — فكان التثبيت يفشل بصمت وتبقى النسخة
      # القديمة على الهاتف. نحفظ المفتاح في ذاكرة GitHub المؤقتة
      # بمفتاحٍ ثابت، فيبقى التوقيع واحداً عبر كل البناءات.
      - name: استرجاع مفتاح التوقيع
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: noor-signing-key-v1

      - name: إنشاء المفتاح إن لم يوجد
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Noor, OU=Personal, O=Noor, L=Amman, S=Amman, C=JO"

      - name: بصمة التوقيع
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey | grep "SHA-256" || true

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء التطبيق
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-blocker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
